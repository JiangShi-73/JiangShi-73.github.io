<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1500" width="1200" height="1500">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#07080d"/>
      <stop offset="70%" stop-color="#141a2a"/>
      <stop offset="100%" stop-color="#04050a"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#04050a" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#04050a"/>
    </linearGradient>
    <radialGradient id="sun" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd166" stop-opacity="0.95"/>
      <stop offset="55%" stop-color="#ffd166" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ffd166" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="haze" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3b4a6b" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#3b4a6b" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vig" cx="50%" cy="46%" r="72%">
      <stop offset="55%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.55"/>
    </radialGradient>
    <filter id="n" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="4" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter>
  </defs>

  <rect width="1200" height="1500" fill="url(#sky)"/>
  <ellipse cx="808" cy="790" rx="520" ry="360" fill="url(#sun)"/>
  <ellipse cx="328" cy="910" rx="460" ry="200" fill="url(#haze)" opacity="0.7"/>

  <g fill="#ffffff" fill-opacity="0.05">
    <rect x="0" y="840" width="1200" height="16"/>
    <rect x="0" y="900" width="740" height="10"/>
    <rect x="420" y="954" width="780" height="8"/>
  </g>

  <rect x="0" y="1050" width="1200" height="450" fill="url(#ground)"/>
  <path d="M0 1050 L1200 1010" stroke="#ffffff" stroke-opacity="0.12" stroke-width="2"/>
  <rect width="1200" height="1500" fill="url(#vig)"/>
  <rect width="1200" height="1500" filter="url(#n)" opacity="0.055"/>
</svg>